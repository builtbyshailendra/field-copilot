version: 2
updates:
  - package-ecosystem: pip
    directory: /core
    schedule: {interval: weekly}
    groups:
      minor-and-patch: {update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups:
      minor-and-patch: {update-types: [minor, patch]}
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
