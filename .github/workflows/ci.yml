name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: platform tests (fake model)
    runs-on: ubuntu-latest
    env:
      FIELD_LLM_MODE: fake
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - name: Install
        run: pip install -e "core[dev]"
      - name: Test
        working-directory: core
        run: python -m pytest
