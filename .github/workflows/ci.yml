name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: platform tests (fake model)
    runs-on: ubuntu-latest
    env:
      FIELD_LLM_MODE: fake
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - name: Install
        run: pip install -e "core[dev,rag,agents,api,frameworks]"
      - name: Test
        working-directory: core
        run: python -m pytest
      - name: Evaluation suite with quality gates
        working-directory: core
        run: python -m fieldcopilot.evals.suite --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-suite
          path: core/evals/results/suite/

  api:
    name: API on PostgreSQL (row-level security, approvals, jobs)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FIELD_LLM_MODE: fake
      FIELD_EMBEDDER: hashing
      FIELD_TEST_ADMIN_SERVER_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: pip install -e "core[dev,rag,agents,api,frameworks]"
      - name: API tests
        working-directory: core
        run: python -m pytest tests/test_api.py

  web-e2e:
    name: web app end to end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FIELD_E2E_SERVER: postgresql://postgres:postgres@localhost:5432
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e "core[rag,agents,api]"
      - run: psql -h localhost -U postgres -c "CREATE DATABASE fieldcopilot_e2e"
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/

  pgvector:
    name: vector store on PostgreSQL + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FIELD_LLM_MODE: fake
      FIELD_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: pip install -e "core[dev,rag]"
      - name: Store tests against pgvector
        working-directory: core
        run: python -m pytest tests/test_retrieval.py -k pg_index
