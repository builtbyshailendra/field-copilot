name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart:
    name: lint and render the chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/field-copilot
      - name: Render demo, canary and both customers
        run: |
          helm template demo deploy/helm/field-copilot > /tmp/demo.yaml
          helm template demo deploy/helm/field-copilot --set rollouts.enabled=true > /tmp/canary.yaml
          helm template corvane deploy/helm/field-copilot -f deploy/helm/values-corvane.yaml > /tmp/corvane.yaml
          helm template tallowmere deploy/helm/field-copilot -f deploy/helm/values-tallowmere.yaml > /tmp/tallowmere.yaml
      - name: Validate against Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -ignore-missing-schemas -summary /tmp/demo.yaml /tmp/canary.yaml /tmp/corvane.yaml /tmp/tallowmere.yaml
      - name: Check the alert rules with promtool
        run: |
          python -c "import yaml; d=yaml.safe_load(open('deploy/observability/prometheus-rules.yaml')); yaml.safe_dump(d['spec'], open('/tmp/rules.yaml','w'))"
          docker run --rm -v /tmp:/w --entrypoint promtool prom/prometheus:v2.55.1 check rules /w/rules.yaml

  terraform:
    name: Terraform for AWS (validate and tests, no account needed)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform/aws
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "1.17.1"}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: terraform test (mocked AWS provider)
        run: terraform test

  load:
    name: k6 load test, answer cache off vs on (fake model, 1 s simulated per model call)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FIELD_LLM_MODE: fake
      FIELD_EMBEDDER: hashing
      FIELD_FAKE_LATENCY_MS: "1000"
      FIELD_RATE_PER_MINUTE: "100000"
      FIELD_DEMO_PASSWORD: ci-demo-password
      PG: postgresql://postgres:ci-postgres-password@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: core/pyproject.toml}
      - run: pip install -e "core[rag,agents,api]"
      - name: Two databases, one per run
        run: psql "$PG/postgres" -c "CREATE DATABASE fc_off" -c "CREATE DATABASE fc_on"
      - name: Start the API with the cache off (8020), then on (8021)
        run: |
          start() {
            FIELD_ANSWER_CACHE=$1 FIELD_ADMIN_DSN="$PG/$2" FIELD_APP_DSN="postgresql://copilot_app:copilot-app-dev@127.0.0.1:5432/$2" \
              nohup uvicorn fieldcopilot.api.app:app --host 127.0.0.1 --port $3 > api-$1.log 2>&1 &
            for i in $(seq 1 90); do curl -sf http://127.0.0.1:$3/v1/selfcheck | grep -q score && return 0; sleep 2; done
            cat api-$1.log; return 1
          }
          start off fc_off 8020
          start on fc_on 8021
      - uses: grafana/setup-k6-action@v1
      - name: k6 with the cache off
        run: k6 run -e BASE_URL=http://127.0.0.1:8020 -e PASSWORD="$FIELD_DEMO_PASSWORD" -e P95_MS=15000 --summary-export k6-cache-off.json deploy/load/ask.js
      - name: k6 with the cache on
        run: k6 run -e BASE_URL=http://127.0.0.1:8021 -e PASSWORD="$FIELD_DEMO_PASSWORD" -e P95_MS=15000 --summary-export k6-cache-on.json deploy/load/ask.js
      - name: Model calls each server made
        if: always()
        run: for p in 8020 8021; do echo "== $p"; curl -s http://127.0.0.1:$p/metrics | grep -E '^fieldcopilot_(llm_calls|answer_cache)_total'; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: |
            k6-cache-*.json
            api-*.log

  kind-canary:
    name: build images, deploy to kind, eval-gated canary drill
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: azure/setup-helm@v4
      - name: Build the API image
        run: docker build -f deploy/docker/api.Dockerfile -t field-copilot-api:ci .
      - name: Build the web image
        run: docker build -f deploy/docker/web.Dockerfile --build-arg API_URL=http://demo-api:8020 -t field-copilot-web:ci .
      - uses: helm/kind-action@v1
        with: {cluster_name: copilot}
      - run: kind load docker-image field-copilot-api:ci field-copilot-web:ci --name copilot
      - name: Canary drill
        run: bash deploy/scripts/canary_drill.sh
