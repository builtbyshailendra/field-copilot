name: kubernetes-lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failure-lab:
    name: inject failures into kind and investigate them
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: pip install -e "core[rag]"
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: field-lab
      - name: Run the lab
        env:
          FIELD_LLM_MODE: fake
        run: python lab/run_lab.py | tee lab-results.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-results
          path: lab-results.md
