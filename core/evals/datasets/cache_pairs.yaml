  - {base: "What Epworth score is needed for a sleep study?", variant: "What Epworth Sleepiness Scale score does a sleep study require?", same: true}
  - {base: "What BMI qualifies for bariatric surgery without other conditions?", variant: "Without other conditions, what BMI qualifies someone for bariatric surgery?", same: true}
  - {base: "How recent must a knee X-ray be before a knee MRI?", variant: "How old can a knee X-ray be when a knee MRI is requested?", same: true}
  - {base: "What is the decision deadline for an expedited request?", variant: "What's the deadline to decide an expedited request?", same: true}
  - {base: "What AHI qualifies for the initial 90-day CPAP rental?", variant: "What AHI qualifies for continued CPAP coverage after 90 days?", same: false}
  - {base: "What BMI qualifies for bariatric surgery without other conditions?", variant: "What BMI qualifies for bariatric surgery with a related condition?", same: false}
