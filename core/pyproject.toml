[project]
name = "fieldcopilot"
version = "0.1.0"
description = "One AI copilot platform, deployed for two customers"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.8,<3",
  "pydantic>=2.9",
  "pyyaml>=6",
  "httpx>=0.27",
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
rag = ["numpy>=2", "psycopg[binary]>=3.2", "fastembed>=0.9"]
agents = ["mcp>=2.3,<3", "pillow>=10", "scikit-learn>=1.5", "langgraph>=1.2", "llama-index-core>=0.14"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pyjwt>=2.9"]
voice = ["faster-whisper>=1.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
