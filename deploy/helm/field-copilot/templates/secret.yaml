{{- if not .Values.secrets.existingSecret }}
{{- $db := printf "%s-postgres" (include "fc.name" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fc.name" . }}-secrets
  labels: {{- include "fc.labels" . | nindent 4 }}
type: Opaque
stringData:
  FIELD_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  FIELD_DEMO_PASSWORD: {{ .Values.secrets.demoPassword | quote }}
  FIELD_ADMIN_DSN: {{ printf "postgresql://postgres:%s@%s:5432/fieldcopilot" .Values.postgres.password $db | quote }}
  FIELD_APP_DSN: {{ printf "postgresql://copilot_app:copilot-app-dev@%s:5432/fieldcopilot" $db | quote }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
{{- end }}
