# The API and worker run as this service account. On EKS, a Pod Identity association
# (deploy/terraform/aws) gives it the copilot's AWS role: call Claude in Bedrock, read its
# own secret, nothing else. Its Kubernetes token is mounted only when the investigator
# needs to read a live cluster (clusterAccess.enabled).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels: {{- include "fc.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.clusterAccess.enabled }}
