# Tallowmere Health Plan: PHI, so the model endpoint must be covered by a BAA, prompts carry
# minimum-necessary data, and the copilot reads prior-auth-workbench with its own token.
image:
  api: {tag: "REPLACE_WITH_RELEASE_SHA"}
  web: {tag: "REPLACE_WITH_RELEASE_SHA"}
api:
  replicas: 2
  env:
    FIELD_LLM_MODE: anthropic
    FIELD_EMBEDDER: fastembed
    FIELD_WORKBENCH_URL: http://priorauth-workflow.priorauth.svc.cluster.local:8000
    APP_ENV: prod
rollouts: {enabled: true, canaryWeight: 25, minQuality: 0.8}
postgres: {enabled: false}
secrets: {existingSecret: field-copilot-tallowmere}   # includes FIELD_WORKBENCH_TOKEN and ANTHROPIC_API_KEY
hpa: {enabled: true, minReplicas: 2, maxReplicas: 4, cpu: 70}
serviceMonitor: {enabled: true}
