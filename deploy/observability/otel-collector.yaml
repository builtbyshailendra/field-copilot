# OpenTelemetry Collector: receives traces from the API and worker (OTLP/HTTP), drops any
# attribute that could carry content, and forwards to the tracing backend (Tempo here).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
  attributes/strip-content:
    actions:
      - {key: gen_ai.input.messages, action: delete}
      - {key: gen_ai.output.messages, action: delete}
      - {key: gen_ai.system_instructions, action: delete}
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/strip-content, batch]
      exporters: [otlp/tempo]
