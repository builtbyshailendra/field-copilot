# A pod shaped like the chart's API pod (should pass everything) and two that should not.
apiVersion: v1
kind: Pod
metadata:
  name: good-api
  namespace: copilot
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: api
      image: ghcr.io/builtbyshailendra/field-copilot-api:0.1.0
      resources:
        requests: {cpu: 100m, memory: 384Mi}
        limits: {memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod
  namespace: copilot
spec:
  containers:
    - name: app
      image: docker.io/library/nginx:latest
      securityContext:
        allowPrivilegeEscalation: true
        capabilities: {add: ["NET_ADMIN"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: untagged-pod
  namespace: copilot
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: api
      image: ghcr.io/builtbyshailendra/field-copilot-api
      resources:
        requests: {cpu: 100m, memory: 384Mi}
        limits: {memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
